name: primio_app
description: A Primio-generated Flutter app
publish_to: none
version: 1.0.0+5
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  equatable: ^2.0.7
  shared_preferences: ^2.5.3
  go_router: ^14.1.4
  google_fonts: ^6.3.2
  flutter_animate: ^4.5.2
  vector_math: ^2.1.4
  archive: ^4.0.7
dev_dependencies:
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.3
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"  
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
